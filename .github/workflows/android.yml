name: Android app

# Builds the Android shell and publishes it as HaniaFlight.apk on the "android-latest" release.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Reuse one signing key between builds, so a newer APK can install over an older one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hania-flight-debug-keystore-v1
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HaniaFlight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HaniaFlight-apk
          path: HaniaFlight.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: HaniaFlight for Android
          body: |
            התקנה: הורידו את HaniaFlight.apk בטלפון, פתחו אותו ואשרו התקנה ממקור זה.
            Install: download HaniaFlight.apk on the phone, open it and allow installing from this source.
          files: HaniaFlight.apk
          make_latest: true
