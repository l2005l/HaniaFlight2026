# HaniaFlight multiplayer rooms: a tiny WebSocket relay on Cloudflare Workers + Durable Objects (free plan, SQLite class).
name = "haniaflight-mp"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
